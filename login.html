<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background:#000;
    color:#fff;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  .box { width:360px; text-align:center; }
  input {
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#111;
    border:1px solid #444;
    color:#fff;
    border-radius:6px;
  }
  button {
    width:100%;
    padding:12px;
    margin-top:10px;
    background:gold;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:6px;
  }
  .google { background:#fff; color:#000; }
  a { color:gray; display:block; margin-top:15px; }
</style>
</head>
<body>

<div class="box">
  <h2>Sign In</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Sign In</button>
  <button class="google" onclick="googleSignIn()">Sign in with Google</button>

  <a href="index.html">← Back to Home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDWgibGFkTYUjE9AG_mOpXW92OgP3ARvUk",
    authDomain: "infivesite.firebaseapp.com",
    projectId: "infivesite"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function login() {
    auth.signInWithEmailAndPassword(email.value, password.value)
      .then(() => window.location = "index.html")
      .catch(err => alert(err.message));
  }

  function googleSignIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(() => window.location = "index.html")
      .catch(err => alert(err.message));
  }
</script>

</body>
</html>
