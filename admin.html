<div class="table-container" style="grid-column: span 2; margin-top: 20px;">
    <h3>Self Publishing Applications</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Title</th>
                <th>Links</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="contactTableBody">
            </tbody>
    </table>
</div>

<script>
    // Load Contact Form Submissions
    db.collection("contacts").orderBy("submittedAt", "desc").onSnapshot(snapshot => {
        const tbody = document.getElementById("contactTableBody");
        tbody.innerHTML = "";
        snapshot.forEach(doc => {
            const data = doc.data();
            const date = data.submittedAt ? data.submittedAt.toDate().toLocaleDateString() : 'Pending';
            tbody.innerHTML += `<tr>
                <td>${data.firstName} ${data.lastName}</td>
                <td>${data.email}</td>
                <td>${data.contentTitle}</td>
                <td><a href="${data.contentLink}" target="_blank" style="color:gold;">Video</a> | <a href="${data.posterLink}" target="_blank" style="color:gold;">Poster</a></td>
                <td>${date}</td>
            </tr>`;
        });
    });
</script>
