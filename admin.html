<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Admin | IN FIVE</title>
    <style>
        :root { --gold: #e6b800; --red: #d93025; --bg: #000; --card: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        /* Analytics Tiles */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-tile { background: var(--card); padding: 20px; border-radius: 10px; border-bottom: 3px solid var(--gold); }
        .stat-tile h4 { margin: 0; color: #888; text-transform: uppercase; font-size: 12px; }
        .stat-tile p { font-size: 28px; font-weight: bold; margin: 10px 0 0; }

        /* Search & Filters */
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        #adminSearch { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }

        /* Tables */
        .section { background: var(--card); padding: 20px; border-radius: 10px; margin-bottom: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--gold); padding: 15px; border-bottom: 1px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 14px; }
        
        /* Action Buttons */
        .btn { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; font-size: 12px; font-weight: bold; }
        .btn-cancel { background: #444; color: white; }
        .btn-delete { background: var(--red); color: white; margin-left: 5px; }
        .status-pill { padding: 4px 8px; border-radius: 12px; font-size: 11px; }
    </style>
</head>
<body>

    <h2 style="color: var(--gold);">Executive Control Center</h2>

    <div class="stat-grid">
        <div class="stat-tile"><h4>Site Sessions</h4><p id="stat-sessions">22</p></div>
        <div class="stat-tile"><h4>Total Sales</h4><p id="stat-revenue">BHD 0.000</p></div>
        <div class="stat-tile"><h4>Active Subscriptions</h4><p id="stat-active">0</p></div>
        <div class="stat-tile"><h4>Global Users</h4><p id="stat-total-users">0</p></div>
    </div>

    <div class="controls">
        <input type="text" id="adminSearch" placeholder="Search by email, name, or country..." onkeyup="filterData()">
    </div>

    <div class="section">
        <h3>User Management & Status</h3>
        <table>
            <thead>
                <tr>
                    <th>User Email</th>
                    <th>Country</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>

    <div class="section">
        <h3>Self Publishing Applications</h3>
        <table>
            <thead>
                <tr>
                    <th>Applicant</th>
                    <th>Content Title</th>
                    <th>Description & Notes</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="contactTableBody"></tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        // Load All Data on Auth
        auth.onAuthStateChanged(user => {
            if (!user) return window.location.href = "signin.html";
            loadAnalytics();
            loadUsers();
            loadContacts();
        });

        // 1. Load Analytics Tiles
        function loadAnalytics() {
            db.collection("sales").onSnapshot(snap => {
                let rev = 0;
                snap.forEach(doc => rev += doc.data().amount || 0);
                document.getElementById("stat-revenue").innerText = `BHD ${rev.toFixed(3)}`;
            });
        }

        // 2. Load User Table with Actions (Cancel/Delete)
        function loadUsers() {
            db.collection("users").onSnapshot(snap => {
                const tbody = document.getElementById("userTableBody");
                document.getElementById("stat-total-users").innerText = snap.size;
                tbody.innerHTML = "";
                
                snap.forEach(doc => {
                    const u = doc.data();
                    const statusColor = u.subscriptionStatus === 'Active' ? '#28a745' : '#777';
                    
                    tbody.innerHTML += `
                        <tr class="searchable">
                            <td>${u.email}</td>
                            <td>${u.country || 'Not Set'}</td>
                            <td><span class="status-pill" style="background:${statusColor}">${u.subscriptionStatus || 'Inactive'}</span></td>
                            <td>
                                <button class="btn btn-cancel" onclick="updateStatus('${doc.id}', 'Cancelled')">Cancel Sub</button>
                                <button class="btn btn-delete" onclick="deleteUser('${doc.id}')">Delete Account</button>
                            </td>
                        </tr>`;
                });
            });
        }

        // 3. User Actions
        async function updateStatus(uid, status) {
            if(confirm(`Set status to ${status}?`)) {
                await db.collection("users").doc(uid).update({ subscriptionStatus: status, lastAction: 'Admin Manual Update' });
            }
        }

        async function deleteUser(uid) {
            if(confirm("PERMANENTLY DELETE THIS USER? This cannot be undone.")) {
                await db.collection("users").doc(uid).delete();
            }
        }

        // 4. Load Publishing Applications
        function loadContacts() {
            db.collection("contacts").orderBy("submittedAt", "desc").onSnapshot(snap => {
                const tbody = document.getElementById("contactTableBody");
                tbody.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td>${d.firstName} ${d.lastName}<br><small>${d.email}</small></td>
                            <td><strong>${d.contentTitle}</strong></td>
                            <td style="color:#aaa; max-width:400px;">${d.description}</td>
                            <td>${d.submittedAt?.toDate().toLocaleDateString() || '---'}</td>
                        </tr>`;
                });
            });
        }

        // 5. Search Functionality
        function filterData() {
            const input = document.getElementById("adminSearch").value.toLowerCase();
            const rows = document.querySelectorAll(".searchable");
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(input) ? "" : "none";
            });
        }
    </script>
</body>
</html>
