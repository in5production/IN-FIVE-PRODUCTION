<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | IN FIVE</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h2 { color: gold; border-bottom: 2px solid gold; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        .full-width { grid-column: span 2; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: gold; border-bottom: 1px solid #444; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #222; font-size: 14px; }
        a { color: gold; text-decoration: none; }
    </style>
</head>
<body>

    <h2>Admin Control Panel</h2>

    <div class="grid">
        <div class="card">
            <h3>Registered User Actions</h3>
            <table>
                <thead>
                    <tr><th>Email</th><th>Status</th><th>Last Action</th></tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>New Subscriptions (Home Bar)</h3>
            <table>
                <thead>
                    <tr><th>Email</th><th>Date</th></tr>
                </thead>
                <tbody id="subTableBody"></tbody>
            </table>
        </div>

        <div class="card full-width">
            <h3>Self Publishing Applications (Contact Form)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Title</th>
                        <th>Links</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="contactTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log("Admin logged in:", user.email);

                // Load Registered Users
                db.collection("users").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                    const tbody = document.getElementById("userTableBody");
                    if(tbody) {
                        tbody.innerHTML = "";
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            tbody.innerHTML += `<tr>
                                <td>${data.email}</td>
                                <td style="color:${data.subscriptionStatus === 'Cancelled' ? 'red' : 'green'}">${data.subscriptionStatus || 'Active'}</td>
                                <td>${data.lastAction || 'Signed Up'}</td>
                            </tr>`;
                        });
                    }
                });

                // Load Newsletter Subscriptions
                db.collection("subscriptions").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                    const tbody = document.getElementById("subTableBody");
                    if(tbody) {
                        tbody.innerHTML = "";
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'Pending';
                            tbody.innerHTML += `<tr><td>${data.email}</td><td>${date}</td></tr>`;
                        });
                    }
                });

                // Load Contact Submissions
                db.collection("contacts").orderBy("submittedAt", "desc").onSnapshot(snapshot => {
                    const tbody = document.getElementById("contactTableBody");
                    if(tbody) {
                        tbody.innerHTML = "";
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            const date = data.submittedAt ? data.submittedAt.toDate().toLocaleDateString() : 'Pending';
                            tbody.innerHTML += `<tr>
                                <td>${data.firstName || ''} ${data.lastName || ''}</td>
                                <td>${data.email || ''}</td>
                                <td>${data.contentTitle || ''}</td>
                                <td><a href="${data.contentLink}" target="_blank">Video</a> | <a href="${data.posterLink}" target="_blank">Poster</a></td>
                                <td>${date}</td>
                            </tr>`;
                        });
                    }
                });

            } else {
                window.location.href = "signin.html";
            }
        });
    </script>
</body>
</html>
