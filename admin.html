<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | IN FIVE</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .analytics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #111; padding: 20px; border-radius: 8px; border-left: 4px solid gold; }
        .stat-card h4 { margin: 0; color: #888; font-size: 14px; }
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; }
        
        .table-section { background: #111; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: gold; padding: 12px; border-bottom: 1px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 13px; }
    </style>
</head>
<body>

    <h2 style="color: gold;">IN FIVE Business Analytics</h2>

    <div class="analytics-grid">
        <div class="stat-card"><h4>Site Sessions</h4><p>22</p></div> <div class="stat-card"><h4>Total Sales</h4><p id="totalSales">BHD 0.000</p></div>
        <div class="stat-card"><h4>Total Subscriptions</h4><p id="totalSubs">0</p></div>
        <div class="stat-card"><h4>Applications</h4><p id="totalApps">0</p></div>
    </div>

    <div class="table-section">
        <h3>Self Publishing Applications</h3>
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Content Title</th>
                    <th>Description</th>
                    <th>Links</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="contactTableBody"></tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "signin.html"; return; }

            // 1. Calculate Sales Analytics
            db.collection("sales").onSnapshot(snap => {
                let revenue = 0;
                document.getElementById("totalSubs").innerText = snap.size;
                snap.forEach(doc => revenue += doc.data().amount);
                document.getElementById("totalSales").innerText = `BHD ${revenue.toFixed(3)}`;
            });

            // 2. Load Publishing Apps with Description
            db.collection("contacts").orderBy("submittedAt", "desc").onSnapshot(snap => {
                const tbody = document.getElementById("contactTableBody");
                document.getElementById("totalApps").innerText = snap.size;
                tbody.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const date = d.submittedAt ? d.submittedAt.toDate().toLocaleDateString() : '---';
                    tbody.innerHTML += `
                        <tr>
                            <td>${d.firstName} ${d.lastName}<br><small>${d.email}</small></td>
                            <td>${d.contentTitle}</td>
                            <td style="max-width:300px; color:#aaa;">${d.description || 'No description provided'}</td>
                            <td><a href="${d.contentLink}" target="_blank" style="color:gold;">View</a></td>
                            <td>${date}</td>
                        </tr>`;
                });
            });
        });
    </script>
</body>
</html>
