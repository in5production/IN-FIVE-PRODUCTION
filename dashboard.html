<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings | IN FIVE</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #111; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #333; text-align: center; }
        h2, h3 { color: gold; margin-bottom: 20px; }
        #userEmail { color: #888; margin-bottom: 20px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; text-decoration: none; display: block; box-sizing: border-box; }
        
        /* Cancel Button Style */
        .btn-outline { background: transparent; border: 1px solid #444; color: #fff; }
        .btn-outline:hover { border-color: gold; color: gold; }
        
        /* Subscribe Button Style */
        .btn-gold { background: gold; color: black; }
        .btn-gold:hover { background: #e6c200; }

        /* Delete Button Style */
        .btn-red { background: #d93025; color: white; }
        .btn-red:hover { background: #b71c1c; }
    </style>
</head>
<body>

<div class="card">
    <h2>Account Settings</h2>
    <p id="userEmail">Loading...</p>
    
    <div id="sub-section">
        <h3>Subscription</h3>
        <p id="subStatusText">Status: Loading...</p>
        <div id="subActionContainer"></div>
    </div>

    <div style="margin-top: 40px;">
        <h3>Privacy</h3>
        <button class="btn btn-red" onclick="deleteAccount()">Delete My Account</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('userEmail').innerText = user.email;
            
            // Real-time listener for status changes
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    const status = data.subscriptionStatus || "Inactive";
                    const statusText = document.getElementById('subStatusText');
                    const container = document.getElementById('subActionContainer');

                    statusText.innerText = "Status: " + status;

                    // Toggle Button Logic: If Cancelled, show Subscribe
                    // Link changed to purchases.html to fix 404 error
                    if (status === "Cancelled" || status === "Inactive") {
                        statusText.style.color = "#888";
                        container.innerHTML = `
                            <a href="purchases.html" class="btn btn-gold">Subscribe (3 BHD/Month)</a>
                        `;
                    } else {
                        statusText.style.color = "gold";
                        container.innerHTML = `
                            <button class="btn btn-outline" onclick="cancelSubscription()">Cancel Subscription</button>
                        `;
                    }
                }
            });
        } else {
            window.location.href = "signin.html";
        }
    });

    // 1. CANCEL SUBSCRIPTION
    async function cancelSubscription() {
        if (confirm("Are you sure you want to cancel your subscription?")) {
            try {
                const userId = auth.currentUser.uid;
                await db.collection("users").doc(userId).update({
                    subscriptionStatus: "Cancelled",
                    lastAction: "Cancelled Subscription",
                    actionDate: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Subscription cancelled successfully.");
            } catch (err) {
                alert("Error: " + err.message);
            }
        }
    }

    // 2. DELETE ACCOUNT
    async function deleteAccount() {
        if (confirm("WARNING: This permanently deletes your account and data.")) {
            try {
                const user = auth.currentUser;
                const userId = user.uid;

                await db.collection("users").doc(userId).update({
                    accountStatus: "Deleted/Closed",
                    lastAction: "Account Closed",
                    actionDate: firebase.firestore.FieldValue.serverTimestamp()
                });

                await user.delete();
                alert("Account successfully deleted.");
                window.location.href = "index.html";
            } catch (err) {
                alert("For security, please Sign Out and Sign In again before deleting your account.");
                console.error(err);
            }
        }
    }
</script>

</body>
</html>
