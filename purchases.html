<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | IN FIVE PRODUCTION</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; }
        header { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); z-index: 10; padding: 15px 40px; border-bottom: 1px solid #222; box-sizing: border-box; }
        .logo { height: 40px; cursor: pointer; }
        nav { display: flex; gap: 30px; }
        nav a { color: white; text-decoration: none; font-size: 16px; font-weight: bold; }
        nav a:hover { color: gold; }
        .container { max-width: 800px; margin: 150px auto; padding: 20px; text-align: center; }
        .sub-card { background: #111; padding: 40px; border-radius: 12px; border: 1px solid gold; margin-top: 20px; }
        .price-tag { font-size: 48px; color: gold; margin: 20px 0; }
        .checkout-btn { background: #d93025; color: white; border: none; padding: 15px 60px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .checkout-btn:disabled { background: #555; }
    </style>
</head>
<body>

<header>
    <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'" />
    <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="dashboard.html">Account</a>
        <a href="purchases.html" style="color: gold;">Bag</a>
    </nav>
</header>

<div class="container">
    <h1>Complete Your Subscription</h1>
    <div class="sub-card">
        <h3>IN FIVE Premium Access</h3>
        <p>Unlimited Streaming & Creator Tools</p>
        <div class="price-tag">3 BHD <span style="font-size: 16px; color: #777;">/ month</span></div>
        <button class="checkout-btn" id="payBtn">Pay Now</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
    document.getElementById('payBtn').onclick = async () => {
        const user = auth.currentUser;
        if(!user) { alert("Please login first"); window.location.href="signin.html"; return; }

        const btn = document.getElementById('payBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            // Record Sale for Analytics
            await db.collection("sales").add({
                userEmail: user.email,
                amount: 3.000,
                currency: "BHD",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Set status to Active
            await db.collection("users").doc(user.uid).set({
                subscriptionStatus: "Active",
                lastAction: "Subscribed",
                actionDate: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            alert("Payment Successful! Jumping to Home Page...");
            window.location.href = "index.html"; // Final Jump
        } catch (e) {
            alert("Error: " + e.message);
            btn.disabled = false;
            btn.innerText = "Pay Now";
        }
    };
</script>
</body>
</html>
