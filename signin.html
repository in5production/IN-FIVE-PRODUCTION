<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | IN FIVE</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #111; padding: 40px; border-radius: 15px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .btn-main { background: gold; color: black; }
        .btn-google { background: white; color: #555; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-link { background: transparent; color: gold; text-decoration: underline; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="WITE-YELLOW.png" style="height: 40px; margin-bottom: 20px;">
        <h2>Sign In</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button class="btn btn-main" onclick="signIn()">Sign In</button>
        <button class="btn btn-link" onclick="location.href='signup.html'">Create Account</button>
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        <button class="btn btn-google" onclick="googleSignIn()">
            <img src="https://developers.google.com/identity/images/g-logo.png" width="18"> Sign in with Google
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script>
        function signIn() {
            auth.signInWithEmailAndPassword(email.value, password.value)
                .then(() => window.location.href = "index.html")
                .catch(err => alert(err.message));
        }
        function googleSignIn() {
            auth.signInWithPopup(googleProvider)
                .then(() => window.location.href = "index.html")
                .catch(err => alert(err.message));
        }
    </script>
</body>
</html>
