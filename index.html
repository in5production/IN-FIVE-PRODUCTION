<script>
  // Handle Subscribe and log to Firestore
  document.getElementById("subscribeBtn").onclick = () => {
    const email = document.getElementById("subscribeEmail").value.trim();
    if (!email.includes("@")) return alert("Please enter a valid email");

    // 1. Log to Firestore Database
    db.collection("subscriptions").add({
        email: email,
        status: "New Subscriber",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
        // 2. Open Email Client as fallback
        alert("Thank you for subscribing!");
        window.location.href = `mailto:info@in5production.com?subject=New Subscriber&body=${email}`;
    }).catch(err => {
        console.error("Error saving subscription: ", err);
        // Fallback if database write fails
        window.location.href = `mailto:info@in5production.com?subject=New Subscriber&body=${email}`;
    });
  };

  // Dynamic Navigation Logic
  auth.onAuthStateChanged(user => {
    const nav = document.getElementById('navbar');
    if (user) {
      nav.innerHTML = `
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="dashboard.html" style="color:gold;">Account</a>
        <a href="purchases.html">Bag</a>
        <a href="#" onclick="logout()">Sign Out</a>
      `;
    }
  });

  function logout() {
    auth.signOut().then(() => { window.location.reload(); });
  }
</script>
