<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN FIVE PRODUCTION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: black; color: white; overflow-x: hidden; }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 20px 0;
            z-index: 100;
        }

        .logo { position: absolute; left: 40px; height: 45px; cursor: pointer; }
        nav { display: flex; gap: 60px; }
        nav a { color: white; text-decoration: none; font-size: 22px; font-weight: 500; transition: 0.3s; }
        nav a:hover { color: #ffcc00; }

        /* VIDEO SECTION */
        .video-section { height: 100vh; position: relative; }
        .video-section video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        
        .overlay-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
        }

        .overlay-content img { width: 100%; max-width: 650px; margin-bottom: 25px; }

        .subscribe-bar { display: flex; justify-content: center; gap: 10px; }
        .subscribe-bar input {
            padding: 14px 20px;
            width: 340px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }

        .subscribe-bar button {
            padding: 14px 35px;
            border-radius: 30px;
            border: none;
            background: #ffcc00; /* Matching your logo yellow */
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .subscribe-bar button:hover {
            background: #e6b800;
            transform: scale(1.05);
        }

        /* STORY / SERVICES / CLIENTS */
        .section, .services { text-align: center; padding: 90px 20px; }
        .section img, .services img { max-width: 450px; margin-bottom: 30px; }
        .service-boxes { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
        .service-box {
            width: 300px;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            line-height: 1.8;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .clients { text-align: center; padding: 80px 0; }
        .clients img { width: 80%; max-width: 1000px; }

        /* FOOTER */
        footer { text-align: center; padding: 30px; border-top: 1px solid #333; }
        .social-icons img { width: 120px; filter: grayscale(100%); cursor: pointer; transition: 0.3s; }
        .social-icons img:hover { filter: grayscale(0%); }

        @media (max-width: 768px) {
            .subscribe-bar { flex-direction: column; align-items: center; }
            .subscribe-bar input { width: 100%; max-width: 340px; }
            nav { gap: 30px; }
            nav a { font-size: 18px; }
            .logo { left: 20px; height: 35px; }
        }
    </style>
</head>

<body>

<header>
    <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'">
    <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="video-section">
    <video autoplay muted loop playsinline src="https://github.com/in5production/IN-FIVE-PRODUCTION/raw/main/CLIP.mp4"></video>
    <div class="overlay-content">
        <img src="NAME.png">
        <div class="subscribe-bar">
            <input type="email" id="subscribeEmail" placeholder="Enter your email">
            <button id="subscribeBtn">Subscribe</button>
        </div>
    </div>
</section>

<section class="section">
    <img src="WINNER.png">
    <h2 style="max-width:900px;margin:20px auto;">Our story began 30 years ago...</h2>
    <p style="max-width:800px;margin:auto;">A media institution of competent specialists...</p>
</section>

<footer>
    <div class="social-icons">
        <a href="https://www.instagram.com/o.houseco/" target="_blank">
            <img src="https://raw.githubusercontent.com/in5production/IN-FIVE-PRODUCTION/main/socialmediaicons.png">
        </a>
    </div>
    <p>Copyright ©2025 by خمسة IN5 Movies, Inc.</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
    // 1. Firebase Config (Matches your contact page)
    const firebaseConfig = {
        apiKey: "AIzaSyDWgibGFkTYUjE9AG_mOpXW92OgP3ARvUk",
        authDomain: "infivesite.firebaseapp.com",
        projectId: "infivesite",
        storageBucket: "infivesite.appspot.com",
        messagingSenderId: "359834066542",
        appId: "1:359834066542:web:722f2f3efabfd338a0507f",
        measurementId: "G-49E3M70LFE"
    };

    // 2. Initialize
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 3. Subscribe Logic
    document.getElementById("subscribeBtn").onclick = async () => {
        const emailInput = document.getElementById("subscribeEmail");
        const email = emailInput.value;
        const btn = document.getElementById("subscribeBtn");

        if (!email.includes("@")) return alert("Please enter a valid email");

        btn.innerText = "...";
        btn.disabled = true;

        try {
            await db.collection("subscriptions").add({
                email: email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Thank you for subscribing!");
            emailInput.value = "";
        } catch (err) {
            console.error(err);
            alert("Error: " + err.message);
        } finally {
            btn.innerText = "Subscribe";
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
