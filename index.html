<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IN FIVE PRODUCTION</title>
  <style>
    /* Styling remains consistent with your design */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: black; color: white; overflow-x: hidden; }
    header { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.6); z-index: 10; padding: 15px 0; }
    .logo { position: absolute; left: 40px; top: 10px; height: 40px; cursor: pointer; }
    nav { display: flex; gap: 40px; align-items: center; }
    nav a { color: white; text-decoration: none; font-size: 18px; transition: 0.3s; }
    nav a:hover { color: gold; }
    .video-section { position: relative; height: 100vh; width: 100%; overflow: hidden; }
    .video-section video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
    .overlay-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .overlay-content img { width: 600px; max-width: 90%; margin-bottom: 25px; }
    .subscribe-bar { display: flex; gap: 10px; justify-content: center; }
    .subscribe-bar input { width: 320px; padding: 14px; border-radius: 30px; border: none; outline: none; background: rgba(255,255,255,0.25); color: white; }
    .subscribe-bar button { padding: 14px 28px; border-radius: 30px; border: none; cursor: pointer; background: rgba(255,255,255,0.35); color: white; font-weight: bold; }
    .subscribe-bar button:hover { background: gold; color: black; }
    .section, .services { text-align: center; padding: 90px 20px; }
    .service-boxes { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
    .service-box { width: 280px; padding: 25px; border-radius: 20px; background: rgba(255,255,255,0.1); line-height: 1.8; }
    footer { border-top: 1px solid #333; padding: 25px; text-align: center; color: gray; }
  </style>
</head>
<body>

<header>
  <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'" />
  <nav id="navbar">
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="signin.html">Log In</a>
    <a href="purchases.html">Bag</a>
  </nav>
</header>

<section class="video-section">
  <video autoplay muted loop playsinline src="https://github.com/in5production/IN-FIVE-PRODUCTION/raw/main/CLIP.mp4"></video>
  <div class="overlay-content">
    <img src="NAME.png" alt="IN FIVE" />
    <div class="subscribe-bar">
      <input type="email" id="subscribeEmail" placeholder="Enter your email">
      <button id="subscribeBtn">Subscribe</button>
    </div>
  </div>
</section>

<footer>
  <p>Copyright ©2025 by خمسة IN5 Movies, Inc.</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
  // Ensure DOM is fully loaded before running scripts
  document.addEventListener('DOMContentLoaded', function() {
    
    // 1. Subscription Logic
    const subBtn = document.getElementById("subscribeBtn");
    if (subBtn) {
      subBtn.onclick = () => {
        const emailField = document.getElementById("subscribeEmail");
        const email = emailField.value.trim();
        if (!email.includes("@")) return alert("Please enter a valid email.");

        db.collection("subscriptions").add({
            email: email,
            status: "New Subscriber",
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("Thank you for subscribing!");
            window.location.href = `mailto:info@in5production.com?subject=New Subscriber&body=${email}`;
        }).catch(err => {
            console.error("DB Error:", err);
            window.location.href = `mailto:info@in5production.com?subject=New Subscriber&body=${email}`;
        });
      };
    }

    // 2. Dynamic Navigation Logic
    if (typeof auth !== 'undefined') {
      auth.onAuthStateChanged(user => {
        const nav = document.getElementById('navbar');
        if (user && nav) {
          nav.innerHTML = `
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="dashboard.html" style="color:gold;">Account</a>
            <a href="purchases.html">Bag</a>
            <a href="#" id="logoutLink">Sign Out</a>
          `;
          document.getElementById('logoutLink').onclick = (e) => {
            e.preventDefault();
            auth.signOut().then(() => { window.location.reload(); });
          };
        }
      });
    }
  });
</script>
</body>
</html>
