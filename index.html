<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
    // 1. Initialize EmailJS
    (function() {
        emailjs.init("CQdMpfiaens41DVHe"); 
    })();

    // 2. Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDWgibGFkTYUjE9AG_mOpXW92OgP3ARvUk",
        authDomain: "infivesite.firebaseapp.com",
        projectId: "infivesite",
        storageBucket: "infivesite.appspot.com",
        messagingSenderId: "359834066542",
        appId: "1:359834066542:web:722f2f3efabfd338a0507f",
        measurementId: "G-49E3M70LFE"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 3. Subscription Function
    document.getElementById("subscribeBtn").onclick = async () => {
        const emailInput = document.getElementById("subscribeEmail");
        const email = emailInput.value;
        const btn = document.getElementById("subscribeBtn");

        if (!email || !email.includes("@")) {
            return alert("Please enter a valid email address");
        }

        btn.innerText = "...";
        btn.disabled = true;

        const subData = {
            email: email,
            type: "Newsletter Subscription",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            // A. Save to Firestore
            await db.collection("subscriptions").add(subData);

            // B. Send Private Notification to Hamad
            // Note: You can use the same template or create a simple one for subscribers
            await emailjs.send(
                "service_z0j4k0l", 
                "template_ec5b1gw", // Using your existing template
                {
                    firstName: "New Subscriber",
                    email: email,
                    description: "User subscribed to the newsletter from the homepage."
                }
            );

            alert("Success! You have been subscribed.");
            emailInput.value = "";
        } catch (err) {
            console.error("Error:", err);
            alert("Submission failed. Please try again.");
        } finally {
            btn.innerText = "Subscribe";
            btn.disabled = false;
        }
    };
</script>
