<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
    (function() { emailjs.init("CQdMpfiaens41DVHe"); })();

    const firebaseConfig = {
        apiKey: "AIzaSyDWgibGFkTYUjE9AG_mOpXW92OgP3ARvUk",
        authDomain: "infivesite.firebaseapp.com",
        projectId: "infivesite",
        storageBucket: "infivesite.appspot.com",
        messagingSenderId: "359834066542",
        appId: "1:359834066542:web:722f2f3efabfd338a0507f"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    document.addEventListener('DOMContentLoaded', function() {
        const subBtn = document.getElementById("subscribeBtn");
        const subInput = document.getElementById("subscribeEmail");

        if (subBtn && subInput) {
            subBtn.onclick = async () => {
                const email = subInput.value;
                if (!email || !email.includes("@")) return alert("Valid email required");

                subBtn.innerText = "...";
                try {
                    await db.collection("subscriptions").add({ 
                        email: email, 
                        createdAt: firebase.firestore.FieldValue.serverTimestamp() 
                    });
                    await emailjs.send("service_z0j4k0l", "template_ec5b1gw", {
                        firstName: "New",
                        lastName: "Subscriber",
                        email: email,
                        description: "Home page newsletter signup"
                    });
                    alert("Thank you for subscribing!");
                    subInput.value = "";
                } catch (err) {
                    console.error(err);
                } finally {
                    subBtn.innerText = "Subscribe";
                }
            };
        }
    });
</script>
