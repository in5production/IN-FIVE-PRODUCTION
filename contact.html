<script>
  document.addEventListener('DOMContentLoaded', function() {
    const contactForm = document.getElementById('contactForm');

    contactForm.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.querySelector('button[type="submit"]');
        btn.innerText = "Sending...";
        btn.disabled = true;

        const formData = {
            country: document.getElementsByName('country')[0].value,
            firstName: document.getElementsByName('first_name')[0].value,
            lastName: document.getElementsByName('last_name')[0].value,
            contentTitle: document.getElementsByName('content_title')[0].value,
            phone: document.getElementsByName('phone')[0].value,
            posterLink: document.getElementsByName('poster_link')[0].value,
            email: document.getElementsByName('email')[0].value,
            contentLink: document.getElementsByName('content_link')[0].value,
            description: document.getElementsByName('description')[0].value,
            submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            // Log to Firestore "contacts" collection
            await db.collection("contacts").add(formData);
            alert("Application submitted successfully!");
            contactForm.reset();
        } catch (error) {
            console.error("Firestore Error:", error);
            alert("Error sending. Check if your domain is authorized in Firebase.");
        } finally {
            btn.innerText = "Send";
            btn.disabled = false;
        }
    };
  });
</script>
