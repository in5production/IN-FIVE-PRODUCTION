<script>
    document.addEventListener('DOMContentLoaded', function() {
        const contactForm = document.getElementById('contactForm');
        const btn = document.getElementById('submitBtn');

        // Removed the auth.onAuthStateChanged block to keep the menu static

        contactForm.onsubmit = async (e) => {
            e.preventDefault();
            btn.innerText = "Sending...";
            btn.disabled = true;

            const formData = {
                country: contactForm.country.value || "N/A",
                firstName: contactForm.first_name.value || "N/A",
                lastName: contactForm.last_name.value || "N/A",
                contentTitle: contactForm.content_title.value || "N/A",
                phone: contactForm.phone.value || "N/A",
                posterLink: contactForm.poster_link.value || "N/A",
                email: contactForm.email.value,
                contentLink: contactForm.content_link.value || "N/A",
                description: contactForm.description.value || "N/A",
                submittedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // Ensure 'db' is defined in your firebase.js
                await db.collection("contacts").add(formData);
                alert("Application submitted!");
                contactForm.reset();
            } catch (err) {
                console.error(err);
                alert("Submission failed. Check Console for errors.");
            } finally {
                btn.innerText = "Send";
                btn.disabled = false;
            }
        };
    });
</script>
