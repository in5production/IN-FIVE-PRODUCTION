<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | IN FIVE PRODUCTION</title>
    <style>
        :root {
            --bg: #0f0f10;
            --accent: #f05a24;
            --muted: #9aa2a8;
            --text: #eaf0f3;
        }

        body { 
            background: #050506; 
            color: var(--text); 
            font-family: Arial, sans-serif; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* --- FIXED HEADER --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            position: absolute;
            left: 40px;
            height: 45px;
            cursor: pointer;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 60px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover { color: gold; }

        /* --- FORM CONTAINER --- */
        .container { 
            max-width: 900px; 
            margin: 140px auto 60px; 
            padding: 20px; 
        }

        h1 { font-size: 32px; margin-bottom: 40px; text-align: left; }

        form { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
        }

        .form-group { display: flex; flex-direction: column; }
        
        label { margin-bottom: 8px; font-size: 14px; color: var(--muted); }

        input, textarea { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            padding: 14px; 
            border-radius: 6px; 
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.07);
        }

        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            padding: 16px 60px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 6px; 
            font-size: 16px;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Responsive */
        @media (max-width: 768px) {
            form { grid-template-columns: 1fr; }
            .logo { height: 35px; left: 20px; }
            nav { gap: 30px; }
            nav a { font-size: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'" alt="Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="purchases.html">Bag</a>
        </nav>
    </header>

    <div class="container">
        <h1>Self Publishing</h1>
        <form id="contactForm">
            <div class="form-group"><label>Country</label><input type="text" name="country"></div>
            <div class="form-group"><label>First Name</label><input type="text" name="first_name"></div>
            <div class="form-group"><label>Last Name</label><input type="text" name="last_name"></div>
            <div class="form-group"><label>Content Title</label><input type="text" name="content_title"></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone"></div>
            <div class="form-group"><label>Poster Link</label><input type="url" name="poster_link"></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Content Link</label><input type="url" name="content_link"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Description</label><textarea name="description" rows="4"></textarea></div>
            <div style="grid-column: span 2; text-align: right;">
                <button type="submit" id="submitBtn">Send Application</button>
            </div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            const btn = document.getElementById('submitBtn');

            contactForm.onsubmit = async (e) => {
                e.preventDefault();
                btn.innerText = "Sending...";
                btn.disabled = true;

                const formData = {
                    country: contactForm.country.value || "",
                    firstName: contactForm.first_name.value || "",
                    lastName: contactForm.last_name.value || "",
                    contentTitle: contactForm.content_title.value || "",
                    phone: contactForm.phone.value || "",
                    posterLink: contactForm.poster_link.value || "",
                    email: contactForm.email.value,
                    contentLink: contactForm.content_link.value || "",
                    description: contactForm.description.value || "",
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    await db.collection("contacts").add(formData);
                    alert("Success! Your application has been sent.");
                    contactForm.reset();
                } catch (err) {
                    console.error(err);
                    alert("Error: " + err.message);
                } finally {
                    btn.innerText = "Send Application";
                    btn.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
