<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | IN FIVE PRODUCTION</title>
    <style>
        :root {
            --bg: #050506;
            --yellow: #ffcc00; /* Matching your logo yellow */
            --muted: #9aa2a8;
            --text: #eaf0f3;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', Arial, sans-serif; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* --- FIXED HEADER --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            padding: 25px 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .logo {
            position: absolute;
            left: 40px;
            height: 45px;
            cursor: pointer;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 60px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover { 
            color: var(--yellow); 
        }

        /* --- FORM CONTAINER --- */
        .container { 
            max-width: 900px; 
            margin: 160px auto 80px; 
            padding: 20px; 
        }

        h1 { 
            font-size: 38px; 
            margin-bottom: 40px; 
            letter-spacing: -1px;
        }

        form { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
        }

        .form-group { 
            display: flex; 
            flex-direction: column; 
        }
        
        label { 
            margin-bottom: 10px; 
            font-size: 14px; 
            color: var(--muted); 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, textarea { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            padding: 15px; 
            border-radius: 4px; 
            font-size: 16px;
            transition: border 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--yellow);
            background: rgba(255,255,255,0.06);
        }

        /* --- YELLOW BUTTON --- */
        .submit-wrapper {
            grid-column: span 2; 
            text-align: right;
            margin-top: 20px;
        }

        button { 
            background-color: var(--yellow); 
            color: #000; /* Black text for contrast */
            border: none; 
            padding: 18px 70px; 
            cursor: pointer; 
            font-weight: 800; 
            border-radius: 4px; 
            font-size: 16px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:hover { 
            background-color: #e6b800; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }

        /* Responsive */
        @media (max-width: 768px) {
            form { grid-template-columns: 1fr; }
            .logo { height: 35px; left: 20px; }
            nav { gap: 30px; }
            nav a { font-size: 18px; }
            .submit-wrapper { text-align: center; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'" alt="Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>Self Publishing</h1>
        <form id="contactForm">
            <div class="form-group"><label>Country</label><input type="text" name="country"></div>
            <div class="form-group"><label>First Name</label><input type="text" name="first_name"></div>
            <div class="form-group"><label>Last Name</label><input type="text" name="last_name"></div>
            <div class="form-group"><label>Content Title</label><input type="text" name="content_title"></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone"></div>
            <div class="form-group"><label>Poster Link</label><input type="url" name="poster_link"></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Content Link</label><input type="url" name="content_link"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Description</label><textarea name="description" rows="5"></textarea></div>
            <div class="submit-wrapper">
                <button type="submit" id="submitBtn">Send Application</button>
            </div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            const btn = document.getElementById('submitBtn');

            contactForm.onsubmit = async (e) => {
                e.preventDefault();
                btn.innerText = "Processing...";
                btn.disabled = true;

                const formData = {
                    country: contactForm.country.value || "Not Provided",
                    firstName: contactForm.first_name.value || "",
                    lastName: contactForm.last_name.value || "",
                    contentTitle: contactForm.content_title.value || "",
                    phone: contactForm.phone.value || "",
                    posterLink: contactForm.poster_link.value || "",
                    email: contactForm.email.value,
                    contentLink: contactForm.content_link.value || "",
                    description: contactForm.description.value || "",
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    // This assumes 'db' is initialized in your firebase.js
                    await db.collection("contacts").add(formData);
                    alert("Application submitted successfully!");
                    contactForm.reset();
                } catch (err) {
                    console.error("Submission Error:", err);
                    alert("Error: " + err.message);
                } finally {
                    btn.innerText = "Send Application";
                    btn.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
