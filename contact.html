<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | IN FIVE PRODUCTION</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; }
        header { position: fixed; top: 0; width: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.8); z-index: 10; padding: 15px 0; }
        .logo { position: absolute; left: 40px; top: 10px; height: 40px; cursor: pointer; }
        nav { display: flex; gap: 40px; align-items: center; }
        nav a { color: white; text-decoration: none; font-size: 18px; }
        nav a:hover { color: gold; }
        .container { max-width: 900px; margin: 120px auto 50px; padding: 20px; }
        h1 { font-family: serif; font-size: 40px; margin-bottom: 40px; }
        /* Adjusted grid to match your screenshot layout */
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-size: 14px; color: #aaa; }
        input, textarea { background: transparent; border: 1px solid #444; color: white; padding: 12px; font-size: 16px; border-radius: 4px; }
        input:focus, textarea:focus { border-color: gold; outline: none; }
        .submit-container { grid-column: span 2; display: flex; justify-content: flex-end; margin-top: 10px; }
        button { background-color: #d93025; color: white; border: none; padding: 12px 50px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        button:hover { background-color: #ff0000; }
        @media (max-width: 768px) { form { grid-template-columns: 1fr; } .submit-container { grid-column: span 1; } }
    </style>
</head>
<body>
    <header>
        <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'" />
        <nav id="navbar">
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="signin.html">Log In</a>
            <a href="purchases.html">Bag</a>
        </nav>
    </header>

    <div class="container">
        <h1>Self Publishing</h1>
        <form id="contactForm">
            <div class="left-col">
                <div class="form-group"><label>Country</label><input type="text" id="country" name="country"></div>
                <div class="form-group" style="margin-top:20px;"><label>Content Title</label><input type="text" id="content_title" name="content_title"></div>
                <div class="form-group" style="margin-top:20px;"><label>Poster/Cover Link</label><input type="url" id="poster_link" name="poster_link"></div>
                <div class="form-group" style="margin-top:20px;"><label>Content Link</label><input type="url" id="content_link" name="content_link"></div>
            </div>
            
            <div class="right-col">
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;"><label>First Name</label><input type="text" id="first_name" name="first_name"></div>
                    <div class="form-group" style="flex:1;"><label>Last Name</label><input type="text" id="last_name" name="last_name"></div>
                </div>
                <div class="form-group" style="margin-top:20px;"><label>Phone</label><input type="tel" id="phone" name="phone"></div>
                <div class="form-group" style="margin-top:20px;"><label>Email *</label><input type="email" id="email" name="email" required></div>
                <div class="form-group" style="margin-top:20px;"><label>Description</label><textarea id="description" name="description" rows="4"></textarea></div>
            </div>

            <div class="submit-container">
                <button type="submit" id="submitBtn">Send</button>
            </div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');

            // 1. Handle Form Submission to Firestore
            contactForm.onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.innerText = "Sending...";
                btn.disabled = true;

                const formData = {
                    country: document.getElementById('country').value,
                    firstName: document.getElementById('first_name').value,
                    lastName: document.getElementById('last_name').value,
                    contentTitle: document.getElementById('content_title').value,
                    phone: document.getElementById('phone').value,
                    posterLink: document.getElementById('poster_link').value,
                    email: document.getElementById('email').value,
                    contentLink: document.getElementById('content_link').value,
                    description: document.getElementById('description').value,
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    await db.collection("contacts").add(formData);
                    alert("Message sent successfully!");
                    contactForm.reset();
                } catch (error) {
                    console.error("Error adding document: ", error);
                    alert("Error sending message. Please try again.");
                } finally {
                    btn.innerText = "Send";
                    btn.disabled = false;
                }
            };

            // 2. Dynamic Navigation Logic
            auth.onAuthStateChanged(user => {
                const nav = document.getElementById('navbar');
                if (user && nav) {
                    nav.innerHTML = `
                        <a href="index.html">Home</a>
                        <a href="contact.html">Contact</a>
                        <a href="dashboard.html" style="color:gold;">Account</a>
                        <a href="purchases.html">Bag</a>
                        <a href="#" id="signOutBtn">Sign Out</a>
                    `;
                    document.getElementById('signOutBtn').onclick = (e) => {
                        e.preventDefault();
                        auth.signOut().then(() => { window.location.reload(); });
                    };
                }
            });
        });
    </script>
</body>
</html>
