<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | IN FIVE PRODUCTION</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; }
        header { position: fixed; top: 0; width: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.8); z-index: 10; padding: 15px 0; }
        .logo { position: absolute; left: 40px; top: 10px; height: 40px; cursor: pointer; }
        nav { display: flex; gap: 40px; }
        nav a { color: white; text-decoration: none; font-size: 18px; }
        nav a:hover { color: gold; }
        .container { max-width: 900px; margin: 120px auto 50px; padding: 20px; }
        h1 { font-family: serif; font-size: 40px; margin-bottom: 40px; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-size: 14px; color: #aaa; }
        input, textarea { background: transparent; border: 1px solid #444; color: white; padding: 12px; font-size: 16px; border-radius: 4px; }
        input:focus { border-color: gold; outline: none; }
        .submit-container { grid-column: span 2; display: flex; justify-content: flex-end; }
        button { background-color: #d93025; color: white; border: none; padding: 12px 50px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background-color: #ff0000; }
        @media (max-width: 768px) { form { grid-template-columns: 1fr; } .submit-container { grid-column: span 1; } }
    </style>
</head>
<body>
    <header>
        <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'" />
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="signin.html">Log In</a>
            <a href="purchases.html">Bag</a>
        </nav>
    </header>

    <div class="container">
        <h1>Self Publishing</h1>
        <form action="https://formspree.io/f/your-endpoint" method="POST">
            <div class="form-group"><label>Country</label><input type="text" name="country"></div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;"><label>First Name</label><input type="text" name="first_name"></div>
                <div class="form-group" style="flex:1;"><label>Last Name</label><input type="text" name="last_name"></div>
            </div>
            <div class="form-group"><label>Content Title</label><input type="text" name="content_title"></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone"></div>
            <div class="form-group"><label>Poster/Cover Link</label><input type="url" name="poster_link"></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Content Link</label><input type="url" name="content_link"></div>
            <div class="form-group"><label>Description</label><textarea name="description" rows="4"></textarea></div>
            <div class="submit-container"><button type="submit">Send</button></div>
        </form>
    </div>
</body>
</html>
