<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | IN FIVE PRODUCTION</title>
    <style>
        body {
            background-color: #111; /* Dark background like your image */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            background-color: #ffcc00;
            color: #000;
            padding: 2px 5px;
            margin-left: 2px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            font-family: serif; /* Matches the "Self Publishing" serif font */
            font-size: 40px;
            margin-bottom: 40px;
        }

        /* Form Layout */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, textarea {
            background-color: transparent;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #888;
        }

        .full-width {
            grid-column: span 2;
        }

        .right-column {
            grid-column: 2;
        }

        .left-column {
            grid-column: 1;
        }

        .submit-container {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        button {
            background-color: #d93025; /* Red button from screenshot */
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #b22a1f;
        }

        /* Responsive for mobile */
        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }
            .full-width, .right-column, .left-column, .submit-container {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">IN<span>5</span></div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>Self Publishing</h1>

        <form action="https://formspree.io/f/your-endpoint" method="POST">
            
            <div class="form-group left-column">
                <label>Country</label>
                <input type="text" name="country">
            </div>

            <div style="display: flex; gap: 10px;" class="right-column">
                <div class="form-group" style="flex: 1;">
                    <label>First Name</label>
                    <input type="text" name="first_name">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Last Name</label>
                    <input type="text" name="last_name">
                </div>
            </div>

            <div class="form-group left-column">
                <label>Content Title</label>
                <input type="text" name="content_title">
            </div>

            <div class="form-group right-column">
                <label>Phone</label>
                <input type="tel" name="phone">
            </div>

            <div class="form-group left-column">
                <label>Poster/Cover Link</label>
                <input type="url" name="poster_link">
            </div>

            <div class="form-group right-column">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group left-column">
                <label>Content Link</label>
                <input type="url" name="content_link">
            </div>

            <div class="form-group right-column">
                <label>Description</label>
                <textarea name="description" rows="4"></textarea>
            </div>

            <div class="submit-container">
                <button type="submit">Send</button>
            </div>

        </form>
    </div>

</body>
</html>
