<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | IN FIVE PRODUCTION</title>
    <style>
        :root {
            --bg: #0f0f10;
            --accent: #f05a24;
            --muted: #9aa2a8;
            --text: #eaf0f3;
            --container: 900px;
        }

        body { 
            background: linear-gradient(180deg, #050506 0%, #0b0b0c 100%); 
            color: var(--text); 
            font-family: Arial, sans-serif; 
            margin: 0; 
        }

        /* --- HEADER STYLE --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 20px 0;
            z-index: 100;
        }

        .logo {
            position: absolute;
            left: 40px;
            height: 45px;
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 60px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            transition: 0.3s;
        }

        nav a:hover { color: gold; }

        /* --- FORM LAYOUT --- */
        .container { 
            max-width: var(--container); 
            margin: 150px auto 50px; /* Space for fixed header */
            padding: 20px; 
        }

        h1 { font-size: 36px; margin-bottom: 30px; }

        form { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        
        label { margin-bottom: 8px; color: var(--muted); }

        input, textarea { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid #444; 
            color: white; 
            padding: 12px; 
            border-radius: 4px; 
        }

        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            padding: 15px 50px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 4px; 
            font-size: 16px;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 768px) {
            form { grid-template-columns: 1fr; }
            nav { gap: 20px; }
            nav a { font-size: 16px; }
            .logo { height: 30px; left: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="WITE-YELLOW.png" class="logo" onclick="location.href='index.html'" alt="Logo">
        <nav id="navbar">
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="signin.html">Log In</a>
            <a href="purchases.html">Bag</a>
        </nav>
    </header>

    <div class="container">
        <h1>Self Publishing</h1>
        <form id="contactForm">
            <div class="form-group"><label>Country</label><input type="text" name="country"></div>
            <div class="form-group"><label>First Name</label><input type="text" name="first_name"></div>
            <div class="form-group"><label>Last Name</label><input type="text" name="last_name"></div>
            <div class="form-group"><label>Content Title</label><input type="text" name="content_title"></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone"></div>
            <div class="form-group"><label>Poster Link</label><input type="url" name="poster_link"></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Content Link</label><input type="url" name="content_link"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Description</label><textarea name="description" rows="4"></textarea></div>
            <div style="grid-column: span 2; text-align: right;"><button type="submit" id="submitBtn">Send</button></div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            const nav = document.getElementById('navbar');
            const btn = document.getElementById('submitBtn');

            // Handle Auth State for Nav
            if (typeof auth !== 'undefined') {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        nav.innerHTML = `
                            <a href="index.html">Home</a>
                            <a href="contact.html">Contact</a>
                            <a href="dashboard.html" style="color:gold;">Account</a>
                            <a href="#" onclick="auth.signOut()">Sign Out</a>
                        `;
                    }
                });
            }

            contactForm.onsubmit = async (e) => {
                e.preventDefault();
                btn.innerText = "Sending...";
                btn.disabled = true;

                const formData = {
                    country: contactForm.country.value || "N/A",
                    firstName: contactForm.first_name.value || "N/A",
                    lastName: contactForm.last_name.value || "N/A",
                    contentTitle: contactForm.content_title.value || "N/A",
                    phone: contactForm.phone.value || "N/A",
                    posterLink: contactForm.poster_link.value || "N/A",
                    email: contactForm.email.value,
                    contentLink: contactForm.content_link.value || "N/A",
                    description: contactForm.description.value || "N/A",
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    await db.collection("contacts").add(formData);
                    alert("Application submitted!");
                    contactForm.reset();
                } catch (err) {
                    console.error(err);
                    alert("Submission failed. Check Console for errors.");
                } finally {
                    btn.innerText = "Send";
                    btn.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
